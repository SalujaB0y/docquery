name: eval

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install deps
        working-directory: backend
        run: npm install

      - name: build backend
        working-directory: backend
        run: npm run build

      - name: start backend
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORT: 3001
          RATE_LIMIT_MAX: 200
        run: node dist/index.js > /tmp/backend.log 2>&1 &

      - name: wait for backend
        working-directory: backend
        run: npx wait-on http://localhost:3001/health --timeout 30000

      - name: probe query endpoint
        run: |
          echo "--- backend logs so far ---"
          cat /tmp/backend.log
          echo "--- probe query endpoint ---"
          curl -s -X POST http://localhost:3001/api/query \
            -H "Content-Type: application/json" \
            -d '{"question":"What is algorithmic trading?"}' | cat

      - name: run eval
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVAL_SERVICE_PASSWORD: ${{ secrets.EVAL_SERVICE_PASSWORD }}
          EVAL_API_URL: http://localhost:3001
        run: npm run eval

      - name: show backend logs
        if: always()
        run: cat /tmp/backend.log
